    <script>
        // API Configuration - Detects environment
        const isPreviewEnv = window.location.hostname.includes('usercontent.goog') || window.location.hostname.includes('localhost');
        const apiKey = isPreviewEnv ? "" : "AIzaSyBbTgpqvn7TRW2uCL82tplC9AfvEDT_KvY";

        function triggerHaptic(type = 'light') {
            if (!window.navigator.vibrate) return;
            if (type === 'light') navigator.vibrate(10);
            else if (type === 'success') navigator.vibrate([10, 30, 10]);
        }

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `Status: ${response.status}`);
                    }
                    return await response.json();
                } catch (e) {
                    // Stop if key is invalid or blocked (not a network/temp issue)
                    if (e.message.includes("API key not valid") || e.message.includes("blocked") || e.message.includes("referer")) throw e;
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function callGemini(payload) {
            // Using the specific preview model recommended for this environment
            const model = "gemini-2.5-flash-preview-09-2025";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            
            try {
                return await fetchWithRetry(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
            } catch (e) {
                // Fallback attempt for standard environment
                if (e.message.includes("not found")) {
                    const fallbackUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    return await fetchWithRetry(fallbackUrl, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload) 
                    });
                }
                throw e;
            }
        }

        async function runSearch(query = null) {
            if (event) event.preventDefault();
            const term = query || document.getElementById('main-search-input').value || document.getElementById('nav-search-input').value;
            if (!term) return;
            
            document.getElementById('loading-overlay').classList.remove('hidden');
            triggerHaptic('light');

            try {
                const schema = {
                    type: "OBJECT",
                    properties: {
                        word: { type: "STRING" }, 
                        pos: { type: "STRING" }, 
                        definition: { type: "STRING" },
                        nt: { type: "OBJECT", properties: { greek: { type: "STRING" }, transliteration: { type: "STRING" }, strongs: { type: "STRING" }, occurrences: { type: "STRING" }, lexicon: { type: "STRING" } } },
                        ot: { type: "OBJECT", properties: { hebrew: { type: "STRING" }, transliteration: { type: "STRING" }, strongs: { type: "STRING" }, occurrences: { type: "STRING" }, lexicon: { type: "STRING" } } },
                        usage: { type: "ARRAY", items: { type: "OBJECT", properties: { ref: { type: "STRING" }, text: { type: "STRING" }, context: { type: "STRING" } } } },
                        scholars: { type: "ARRAY", items: { type: "OBJECT", properties: { title: { type: "STRING" }, content: { type: "STRING" } } } },
                        relatedTerms: { type: "ARRAY", items: { type: "STRING" } }
                    },
                    required: ["word", "pos", "definition", "nt", "ot", "usage", "relatedTerms", "scholars"]
                };

                const payload = {
                    contents: [{ parts: [{ text: `Provide deep scholarly analysis for: "${term}". Populating all fields.` }] }],
                    systemInstruction: { parts: [{ text: "You are a senior biblical researcher. Output strictly in the provided JSON schema." }] },
                    generationConfig: { responseMimeType: "application/json", responseSchema: schema }
                };

                const res = await callGemini(payload);
                const data = JSON.parse(res.candidates[0].content.parts[0].text);
                populateDashboard(data, term);
                
                document.getElementById('landing-state').classList.add('hidden');
                document.getElementById('results-state').classList.remove('hidden');
                document.getElementById('results-state').classList.add('flex');
                saveToHistory(term);
                triggerHaptic('success');
            } catch (e) {
                console.error("Search Error:", e);
                showError("API Connection Error", "Ensure your Google Cloud settings permit requests from this domain.");
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        function populateDashboard(data, term) {
            document.getElementById('english-word').innerText = data.word || term;
            document.getElementById('pos-label').innerText = data.pos;
            document.getElementById('synthesized-def').innerHTML = data.definition;
            
            const renderLex = (l, lang, theme) => `
                <div class="md:col-span-4">
                    <p class="text-xs text-slate-400 font-bold mb-3 uppercase tracking-widest">${lang}</p>
                    <p class="text-6xl ${theme} drop-shadow-sm mb-2">${l.greek || l.hebrew || "---"}</p>
                    <p class="text-slate-500 italic text-xl font-serif">${l.transliteration || "---"}</p>
                    <div class="mt-4 flex gap-4 text-sm font-bold text-slate-700">
                        <span>Strongs: ${l.strongs || "---"}</span>
                        <span>Freq: ${l.occurrences || "---"}</span>
                    </div>
                </div>
                <div class="md:col-span-8 bg-white/60 p-6 rounded-3xl border border-white">
                    <p class="text-xs text-slate-400 font-bold mb-2 uppercase tracking-widest">Lexicon Summary</p>
                    <p class="text-lg font-serif text-slate-700 leading-relaxed">${l.lexicon || "No data available."}</p>
                </div>
            `;
            
            document.getElementById('lexical-data-nt').innerHTML = renderLex(data.nt, 'Greek', 'text-primary');
            document.getElementById('lexical-data-ot').innerHTML = renderLex(data.ot, 'Hebrew', 'text-accent-hebrew');
            
            const ntRef = /Matt|Mark|Luke|John|Acts|Rom|Cor|Gal|Eph|Phil|Col|Thes|Tim|Tit|Phm|Heb|Jam|Pet|Jud|Rev/i;
            const ntUsages = data.usage.filter(u => ntRef.test(u.ref));
            const otUsages = data.usage.filter(u => !ntRef.test(u.ref));
            
            const renderUsage = (u, color) => `
                <div class="bg-white/70 rounded-3xl p-6 border border-white shadow-sm hover:-translate-y-1 transition-all">
                    <h4 class="text-sm font-bold ${color} mb-2">${u.ref}</h4>
                    <p class="font-serif text-slate-800 text-lg leading-relaxed italic mb-4">"${u.text}"</p>
                    <p class="text-sm font-medium text-slate-600"><span class="font-bold text-slate-900">Context:</span> ${u.context}</p>
                </div>
            `;
            
            document.getElementById('usage-container-nt').innerHTML = ntUsages.map(u => renderUsage(u, 'text-primary')).join('') || "<p class='text-slate-400'>No direct NT usages found.</p>";
            document.getElementById('usage-container-ot').innerHTML = otUsages.map(u => renderUsage(u, 'text-accent-hebrew')).join('') || "<p class='text-slate-400'>No direct OT usages found.</p>";
            
            document.getElementById('scholars-desk-container').innerHTML = data.scholars.map(s => `
                <div class="p-6 bg-white/70 rounded-2xl border border-white">
                    <h4 class="font-bold text-slate-900 mb-2">${s.title}</h4>
                    <p class="text-sm text-slate-600 leading-relaxed">${s.content}</p>
                </div>
            `).join('');

            const cloud = document.getElementById('word-cloud-container');
            cloud.innerHTML = data.relatedTerms.map(t => `<button onclick="runSearch('${t}')" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:border-primary transition-all shadow-sm">${t}</button>`).join('');
            cloud.classList.remove('hidden');
            
            toggleTestament('nt');
            updateBookmarkIcon(term);
        }

        function toggleTestament(t) {
            const isNT = t === 'nt';
            document.getElementById('tab-nt').className = isNT ? "flex-1 md:w-40 py-3 px-5 bg-white shadow-md rounded-xl text-sm font-bold text-primary" : "flex-1 md:w-40 py-3 px-5 rounded-xl text-sm font-bold text-slate-500";
            document.getElementById('tab-ot').className = !isNT ? "flex-1 md:w-40 py-3 px-5 bg-white shadow-md rounded-xl text-sm font-bold text-accent-hebrew" : "flex-1 md:w-40 py-3 px-5 rounded-xl text-sm font-bold text-slate-500";
            document.getElementById('lexical-data-nt').classList.toggle('hidden', !isNT);
            document.getElementById('lexical-data-ot').classList.toggle('hidden', isNT);
            document.getElementById('usage-container-nt').classList.toggle('hidden', !isNT);
            document.getElementById('usage-container-ot').classList.toggle('hidden', isNT);
        }

        async function handleGenerate(type) {
            const word = document.getElementById('english-word').innerText;
            const modal = document.getElementById('gen-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('gen-modal-panel').classList.remove('scale-95'); }, 10);
            
            const content = document.getElementById('gen-modal-content');
            content.innerHTML = `<div class="flex flex-col items-center justify-center py-20"><i class="ph-fill ph-magic-wand animate-bounce text-5xl text-accent-ai"></i><p class="mt-4 font-bold text-slate-800">Drafting study material...</p></div>`;
            
            try {
                const prompt = `Write a theological ${type === 'sermon' ? 'sermon outline' : 'daily devotional'} for: ${word}. Use HTML tags like <h3>, <h4>, <ul>, <li>.`;
                const res = await callGemini({ contents: [{ parts: [{ text: prompt }] }] });
                content.innerHTML = res.candidates[0].content.parts[0].text;
            } catch (e) {
                content.innerHTML = "AI Generation failed. Check connection.";
            }
        }

        function closeGenModal() {
            document.getElementById('gen-modal').classList.add('opacity-0');
            document.getElementById('gen-modal-panel').classList.add('scale-95');
            setTimeout(() => document.getElementById('gen-modal').classList.add('hidden'), 500);
        }

        function resetToHome() {
            document.getElementById('results-state').classList.add('hidden');
            document.getElementById('landing-state').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSidebar(type) {
            const list = document.getElementById('sidebar-list');
            document.getElementById('sidebar-title').innerText = type === 'bookmarks' ? 'Saved Studies' : 'History';
            const items = JSON.parse(localStorage.getItem(type === 'bookmarks' ? 'univera_bookmarks' : 'univera_history') || '[]');
            list.innerHTML = items.length ? items.map(i => `<button onclick="closeSidebar(); runSearch('${i}')" class="w-full p-4 bg-white/70 border border-white rounded-2xl font-bold text-left group flex justify-between items-center transition-all hover:border-primary">${i}<i class="ph-bold ph-arrow-right opacity-0 group-hover:opacity-100 text-primary"></i></button>`).join('') : '<p class="text-center mt-10 text-slate-400">Empty</p>';
            document.getElementById('sidebar-panel').classList.remove('hidden');
            setTimeout(() => { document.getElementById('sidebar-backdrop').classList.remove('opacity-0'); document.getElementById('sidebar-content').classList.remove('translate-x-full'); }, 10);
        }

        function closeSidebar() {
            document.getElementById('sidebar-backdrop').classList.add('opacity-0');
            document.getElementById('sidebar-content').classList.add('translate-x-full');
            setTimeout(() => document.getElementById('sidebar-panel').classList.add('hidden'), 300);
        }

        function saveToHistory(w) {
            let h = JSON.parse(localStorage.getItem('univera_history') || '[]');
            h = [w, ...h.filter(x => x !== w)].slice(0, 20);
            localStorage.setItem('univera_history', JSON.stringify(h));
        }

        function toggleBookmark() {
            const w = document.getElementById('english-word').innerText;
            if (w === "Word") return;
            let b = JSON.parse(localStorage.getItem('univera_bookmarks') || '[]');
            const exists = b.includes(w);
            if (exists) b = b.filter(x => x !== w); else b.push(w);
            localStorage.setItem('univera_bookmarks', JSON.stringify(b));
            updateBookmarkIcon(w);
            triggerHaptic(exists ? 'light' : 'success');
        }

        function updateBookmarkIcon(w) {
            const b = JSON.parse(localStorage.getItem('univera_bookmarks') || '[]');
            document.getElementById('bookmark-icon').className = b.includes(w) ? 'ph-fill ph-bookmark-simple text-primary' : 'ph-bold ph-bookmark-simple';
        }

        function showError(msg, tip) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-toast-msg').innerText = msg;
            document.getElementById('error-toast-tip').innerText = tip;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { 
                toast.classList.add('translate-y-10', 'opacity-0'); 
                setTimeout(() => toast.classList.add('hidden'), 300); 
            }, 6000);
        }

        function copyGenContent() {
            const textToCopy = document.getElementById('gen-modal-content').innerText;
            const temp = document.createElement('textarea');
            temp.value = textToCopy;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            triggerHaptic('success');
            const btn = event.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="ph-fill ph-check-circle text-lg text-emerald-500"></i> Copied!';
            setTimeout(() => btn.innerHTML = original, 2500);
        }

        const concepts = ["Grace", "Agape", "Shalom", "Logos", "Covenant", "Messiah", "Ruach", "Faith"];
        function initTicker() {
            const container = document.getElementById('word-ticker');
            const set = concepts.map(w => `<span class="mx-6 text-sm font-bold text-slate-400 hover:text-primary cursor-pointer uppercase tracking-widest" onclick="runSearch('${w}')">${w}</span>`).join(' • ');
            container.innerHTML = set + set;
        }

        document.getElementById('main-search-form').addEventListener('submit', () => runSearch());
        document.getElementById('nav-search-form').addEventListener('submit', () => runSearch());
        document.addEventListener('DOMContentLoaded', initTicker);
    </script>
</body>
</html>
